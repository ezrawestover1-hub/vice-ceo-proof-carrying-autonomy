<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Vice CEO business autonomy architecture</title>
  <desc id="desc">Vice CEO is an autonomous business operator. It turns incoming customer needs, approved outreach opportunities, and operating signals into policy-bounded work through a Gemini and Google ADK orchestration core. Westover EPR is one connected deployment example, not the product itself. A separate synthetic public review layer demonstrates the workflow without customer data or external delivery.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf5"/><stop offset="1" stop-color="#eef7f1"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#063c30"/><stop offset="1" stop-color="#0d7658"/></linearGradient>
    <linearGradient id="action" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e3f7ec"/><stop offset="1" stop-color="#c4efd8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#073d31" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#77a494"/></marker>
    <marker id="arrowLight" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#b6e7cf"/></marker>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#0c6c50" opacity=".09"/></pattern>
    <style>
      .eyebrow{font-family:Inter,Arial,sans-serif;font-size:14px;font-weight:800;letter-spacing:2.5px}
      .title{font-family:Georgia,'Times New Roman',serif;font-size:52px;font-weight:700;letter-spacing:-1.2px;fill:#073d31}
      .subtitle{font-family:Inter,Arial,sans-serif;font-size:20px;font-weight:500;fill:#527268}
      .section{font-family:Inter,Arial,sans-serif;font-size:13px;font-weight:800;letter-spacing:2px}
      .cardTitle{font-family:Inter,Arial,sans-serif;font-size:19px;font-weight:760;fill:#103f34}
      .cardCopy{font-family:Inter,Arial,sans-serif;font-size:15px;font-weight:500;fill:#58756b}
      .small{font-family:Inter,Arial,sans-serif;font-size:12px;font-weight:800;letter-spacing:1px;fill:#147254}
      .coreTitle{font-family:Georgia,'Times New Roman',serif;font-size:35px;font-weight:700;fill:#f5fff9}
      .coreCopy{font-family:Inter,Arial,sans-serif;font-size:16px;font-weight:500;fill:#c8e8da}
      .coreCardTitle{font-family:Inter,Arial,sans-serif;font-size:17px;font-weight:750;fill:#f7fff9}
      .coreCardCopy{font-family:Inter,Arial,sans-serif;font-size:13px;font-weight:500;fill:#b8decf}
      .outcome{font-family:Inter,Arial,sans-serif;font-size:14px;font-weight:800;letter-spacing:1.1px;fill:#0f6d50}
      .footer{font-family:Inter,Arial,sans-serif;font-size:14px;font-weight:600;fill:#52736a}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <g transform="translate(70 48)">
    <rect width="177" height="34" rx="17" fill="#ddf4e7"/>
    <circle cx="19" cy="17" r="6" fill="#10a16b"/>
    <text class="eyebrow" x="37" y="22" fill="#0c6149">VICE CEO</text>
    <text class="title" x="0" y="91">The business operator that keeps work moving.</text>
    <text class="subtitle" x="0" y="128">It turns incoming needs into accountable customer service, follow-through, and owner-ready decisions.</text>
  </g>

  <g transform="translate(60 204)">
    <text class="section" x="14" y="-14" fill="#0d654b">BUSINESS SIGNALS</text>
    <rect width="286" height="405" rx="26" fill="#ffffff" stroke="#cde4d8" stroke-width="2" filter="url(#shadow)"/>
    <text class="cardCopy" x="24" y="42">Work comes from the places a business</text>
    <text class="cardCopy" x="24" y="64">already needs to pay attention to.</text>
    <g transform="translate(20 91)">
      <rect width="246" height="79" rx="14" fill="#f4faf7"/>
      <circle cx="26" cy="27" r="14" fill="#dff5e8"/><path d="M19 24h14v9H19zM19 24l7 5 7-5" fill="none" stroke="#0e7959" stroke-width="1.8"/>
      <text class="cardTitle" x="52" y="30">Customer needs</text><text class="cardCopy" x="52" y="55">Inbox, requests, follow-ups</text>
    </g>
    <g transform="translate(20 183)">
      <rect width="246" height="79" rx="14" fill="#f4faf7"/>
      <circle cx="26" cy="27" r="14" fill="#dff5e8"/><path d="M19 31l6-7 5 4 8-10" fill="none" stroke="#0e7959" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="cardTitle" x="52" y="30">Growth work</text><text class="cardCopy" x="52" y="55">Approved prospect follow-up</text>
    </g>
    <g transform="translate(20 275)">
      <rect width="246" height="105" rx="14" fill="#e5f6ed" stroke="#b9e5cb" stroke-width="1.5"/>
      <text class="small" x="18" y="25">CONNECTED EXAMPLE</text>
      <text class="cardTitle" x="18" y="52">Westover EPR</text><text class="cardCopy" x="18" y="77">Approved EPR registry signals</text>
      <text class="small" x="18" y="95">ONE DEPLOYMENT, NOT THE PRODUCT</text>
    </g>
  </g>

  <path d="M346 405H418" fill="none" stroke="#77a494" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(420 187)">
    <rect width="760" height="440" rx="30" fill="url(#core)" filter="url(#shadow)"/>
    <rect x="30" y="27" width="190" height="32" rx="16" fill="#d7f4e5" opacity=".16"/>
    <text class="section" x="49" y="49" fill="#e3f9ed">THE VICE CEO CORE</text>
    <text class="coreTitle" x="30" y="105">Understand → decide → do → learn</text>
    <text class="coreCopy" x="30" y="136">Autonomous workflow—not a chat window. Vice CEO makes bounded progress;</text>
    <text class="coreCopy" x="30" y="157">it escalates only when a person’s judgment is truly required.</text>
    <path d="M220 254H268" fill="none" stroke="#b6e7cf" stroke-width="3" marker-end="url(#arrowLight)"/>
    <path d="M492 254H540" fill="none" stroke="#b6e7cf" stroke-width="3" marker-end="url(#arrowLight)"/>
    <g transform="translate(30 181)">
      <rect width="190" height="145" rx="18" fill="#0b523f" stroke="#4d987c" stroke-width="1.5"/>
      <text class="small" x="20" y="29" fill="#a1edc4">1. UNDERSTAND</text>
      <text class="coreCardTitle" x="20" y="59">Work intake</text>
      <text class="coreCardCopy" x="20" y="84">Classify the request,</text><text class="coreCardCopy" x="20" y="103">collect context, and</text><text class="coreCardCopy" x="20" y="122">spot what matters.</text>
    </g>
    <g transform="translate(270 181)">
      <rect width="222" height="145" rx="18" fill="#f1fbf5"/>
      <text class="small" x="20" y="29">2. DECIDE</text>
      <text class="cardTitle" x="20" y="59">Gemini + Google ADK</text>
      <text class="cardCopy" x="20" y="84">Role-limited specialists</text><text class="cardCopy" x="20" y="103">plan the next useful step.</text>
      <text class="small" x="20" y="127">GEMINI 3.5 FLASH</text>
    </g>
    <g transform="translate(542 181)">
      <rect width="188" height="145" rx="18" fill="#0b523f" stroke="#4d987c" stroke-width="1.5"/>
      <text class="small" x="20" y="29" fill="#a1edc4">3. DO + LEARN</text>
      <text class="coreCardTitle" x="20" y="59">Accountable action</text>
      <text class="coreCardCopy" x="20" y="84">Prepare, execute when</text><text class="coreCardCopy" x="20" y="103">enabled, preserve proof,</text><text class="coreCardCopy" x="20" y="122">and retain context.</text>
    </g>
    <rect x="30" y="353" width="700" height="58" rx="16" fill="#dff6e9"/>
    <circle cx="58" cy="382" r="13" fill="#0e7254"/><path d="M52 382l4 4 9-10" fill="none" stroke="#f5fff9" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="cardTitle" x="85" y="378">Policy + action warrant gate</text>
    <text class="cardCopy" x="85" y="399">Consent · source policy · duplicate protection · evidence receipt · human escalation</text>
  </g>

  <path d="M1180 405H1252" fill="none" stroke="#77a494" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(1254 204)">
    <text class="section" x="14" y="-14" fill="#0d654b">MEANINGFUL PROGRESS</text>
    <rect width="286" height="405" rx="26" fill="#ffffff" stroke="#cde4d8" stroke-width="2" filter="url(#shadow)"/>
    <text class="cardCopy" x="24" y="42">Vice CEO clears routine work and</text>
    <text class="cardCopy" x="24" y="64">brings people in only when needed.</text>
    <g transform="translate(20 91)"><rect width="246" height="79" rx="14" fill="url(#action)"/><text class="outcome" x="18" y="27">CUSTOMER SERVICE</text><text class="cardTitle" x="18" y="55">Routine replies handled</text></g>
    <g transform="translate(20 183)"><rect width="246" height="79" rx="14" fill="url(#action)"/><text class="outcome" x="18" y="27">FOLLOW-THROUGH</text><text class="cardTitle" x="18" y="55">Approved work keeps moving</text></g>
    <g transform="translate(20 275)"><rect width="246" height="105" rx="14" fill="#f4faf7" stroke="#d2e7dc" stroke-width="1.5"/><text class="outcome" x="18" y="27">HUMAN JUDGMENT</text><text class="cardTitle" x="18" y="55">Escalations arrive ready</text><text class="cardCopy" x="18" y="80">Context, recommendation, proof.</text></g>
  </g>

  <g transform="translate(60 676)">
    <rect width="1480" height="150" rx="24" fill="#ffffff" stroke="#cde4d8" stroke-width="2" filter="url(#shadow)"/>
    <g transform="translate(30 27)">
      <text class="section" x="0" y="16" fill="#0d654b">PRODUCTION-MINDED FOUNDATION</text>
      <text class="cardTitle" x="0" y="51">Cloud Run · Firestore memory · Gemini 3.5 Flash · Google ADK</text>
      <text class="cardCopy" x="0" y="78">Policy-bounded workflows, evidence-linked decisions, and long-running business context.</text>
    </g>
    <path d="M842 26V124" fill="none" stroke="#d3e8de" stroke-width="2"/>
    <g transform="translate(878 27)">
      <text class="section" x="0" y="16" fill="#0d654b">PUBLIC DEMO, TRUTHFULLY SCOPED</text>
      <text class="cardTitle" x="0" y="51">Synthetic cases, replayable proof, zero customer data</text>
      <text class="cardCopy" x="0" y="78">Shows the operating model without sending messages or exposing Westover EPR business data.</text>
    </g>
  </g>

  <g transform="translate(70 868)">
    <circle cx="8" cy="0" r="6" fill="#0d7155"/><text class="footer" x="24" y="5">Vice CEO is the product.</text>
    <circle cx="260" cy="0" r="6" fill="#8edeb3"/><text class="footer" x="276" y="5">Westover EPR is a connected example deployment.</text>
    <text class="footer" x="1197" y="5" fill="#0d634b">VICE CEO · BUSINESS AUTONOMY</text>
  </g>
</svg>
