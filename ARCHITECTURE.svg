<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Vice CEO evidence-backed EPR autonomy architecture</title>
  <desc id="desc">A private Cloud Scheduler job invokes a source-locked registry worker, which persists evidence in Firestore, prepares a bounded Gemini briefing, and creates a Cloud Run IAM-protected owner-review action. A separate public synthetic reviewer layer demonstrates proof-carrying governance without operational authority.</desc>
  <style>
    .canvas { fill: #ffffff; }
    .title { fill: #172426; font-family: Inter, Arial, sans-serif; font-size: 47px; font-weight: 600; letter-spacing: -1.6px; }
    .subtitle { fill: #697578; font-family: Inter, Arial, sans-serif; font-size: 25px; }
    .node { fill: #ffffff; stroke: #cfd8d5; stroke-width: 2; }
    .node-accent { fill: #f0f7f4; stroke: #0e5149; stroke-width: 2.5; }
    .node-title { fill: #172426; font-family: Inter, Arial, sans-serif; font-size: 23px; font-weight: 600; }
    .node-copy { fill: #697578; font-family: Inter, Arial, sans-serif; font-size: 18px; }
    .node-copy-accent { fill: #0e5149; font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 600; }
    .step { fill: #0e5149; font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 1.5px; }
    .line { fill: none; stroke: #6f807b; stroke-width: 3; marker-end: url(#arrow); }
    .block { fill: none; stroke: #0e5149; stroke-width: 3; stroke-dasharray: 10 10; marker-end: url(#arrow); }
    .block-label { fill: #0e5149; font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight: 600; }
    .footer { fill: #697578; font-family: Inter, Arial, sans-serif; font-size: 20px; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#6f807b"/></marker>
    <marker id="arrow-forest" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#0e5149"/></marker>
  </defs>
  <rect class="canvas" width="1600" height="900"/>
  <text class="title" x="110" y="112">Vice CEO: evidence-backed EPR autonomy</text>
  <text class="subtitle" x="110" y="154">A private registry watcher, owner decision queue, and public proof layer stay isolated by design.</text>

  <path class="line" d="M313 413 H384"/>
  <path class="line" d="M593 413 H664"/>
  <path class="line" d="M873 413 H944"/>
  <path class="line" d="M1153 413 H1224"/>
  <path class="line" d="M1340 527 V611 H1065"/>
  <path class="block" d="M820 698 V553" style="marker-end:url(#arrow-forest)"/>

  <g transform="translate(110 322)">
    <rect class="node" width="203" height="182" rx="12"/>
    <text class="step" x="26" y="38">01</text>
    <text class="node-title" x="26" y="78">Scheduled event</text>
    <text class="node-copy" x="26" y="112">Cloud Scheduler OIDC</text>
    <text class="node-copy" x="26" y="138">private daily trigger</text>
  </g>
  <g transform="translate(384 322)">
    <rect class="node" width="209" height="182" rx="12"/>
    <text class="step" x="26" y="38">02</text>
    <text class="node-title" x="26" y="78">Private worker</text>
    <text class="node-copy" x="26" y="112">Schema, source lock,</text>
    <text class="node-copy" x="26" y="138">and fail-closed checks</text>
  </g>
  <g transform="translate(664 322)">
    <rect class="node" width="209" height="182" rx="12"/>
    <text class="step" x="26" y="38">03</text>
    <text class="node-title" x="26" y="78">Registry Watch</text>
    <text class="node-copy" x="26" y="112">Approved public EPR</text>
    <text class="node-copy" x="26" y="138">source only</text>
  </g>
  <g transform="translate(944 322)">
    <rect class="node-accent" width="209" height="182" rx="12"/>
    <text class="step" x="26" y="38">04</text>
    <text class="node-title" x="26" y="78">Firestore evidence</text>
    <text class="node-copy-accent" x="26" y="112">Hash snapshots and</text>
    <text class="node-copy-accent" x="26" y="138">idempotent runs</text>
  </g>
  <g transform="translate(1224 322)">
    <rect class="node" width="206" height="182" rx="12"/>
    <text class="step" x="26" y="38">05</text>
    <text class="node-title" x="26" y="78">Bounded Gemini brief</text>
    <text class="node-copy" x="26" y="112">Changed public text only;</text>
    <text class="node-copy" x="26" y="138">delivery separately gated</text>
  </g>
  <g transform="translate(808 611)">
    <rect class="node" width="257" height="160" rx="12"/>
    <text class="step" x="26" y="38">06</text>
    <text class="node-title" x="26" y="78">Private owner review</text>
    <text class="node-copy" x="26" y="112">IAM-protected queue;</text>
    <text class="node-copy" x="26" y="138">acknowledge or archive</text>
  </g>
  <g transform="translate(426 611)">
    <rect class="node" width="266" height="160" rx="12"/>
    <text class="step" x="26" y="38">07</text>
    <text class="node-title" x="26" y="78">Public reviewer</text>
    <text class="node-copy" x="26" y="112">Synthetic proof and</text>
    <text class="node-copy" x="26" y="138">governance tests</text>
  </g>
  <path class="line" d="M808 691 H692"/>
  <g transform="translate(736 744)">
    <rect fill="#f0f7f4" stroke="#0e5149" stroke-width="2" width="168" height="82" rx="41"/>
    <text class="block-label" x="84" y="35" text-anchor="middle">NO CUSTOMER DATA</text>
    <text class="block-label" x="84" y="59" text-anchor="middle">NO PROSPECT OUTREACH</text>
  </g>
  <text class="footer" x="110" y="864">Bounded by design: the public demo is synthetic; the private watcher records evidence and owner review.</text>
  <text class="footer" x="110" y="890">It never receives customer data or prospect-outreach authority.</text>
</svg>
